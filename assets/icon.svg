<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Interview Studio</title>
  <desc>A graphite workspace with a light sidebar, answer lines and a blue status square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303338" />
      <stop offset="1" stop-color="#1a1c20" />
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="1000" height="1000" rx="224" fill="url(#background)" />
  <rect
    x="14"
    y="14"
    width="996"
    height="996"
    rx="222"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".1"
    stroke-width="4"
  />
  <g fill="#f5f4f0">
    <rect x="256" y="256" width="112" height="512" rx="28" />
    <rect x="432" y="256" width="336" height="112" rx="28" />
    <rect x="432" y="456" width="336" height="112" rx="28" />
    <rect x="432" y="656" width="176" height="112" rx="28" />
  </g>
  <rect x="656" y="656" width="112" height="112" rx="28" fill="#8aa6bf" />
</svg>
